career-profile:
  title: Sobre Mim
  summary: |
    Analista de Infraestrutura com mais de 6 anos de experiência em ambientes
    corporativos de alta disponibilidade. Especialista em monitoramento de infraestrutura,
    virtualização e nuvem, com atuação direta na implementação de soluções com
    **Terraform**, **Docker**, **VMware** e **Proxmox**.

    Passou por todas as camadas operacionais — de suporte técnico a coordenação
    de NOC — o que proporciona visão completa do ciclo de vida da infraestrutura.
    Comprometido com automação, observabilidade e entrega contínua de valor.

