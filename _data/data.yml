experiences:
  title: Experiência Profissional
  info:
  - role: Analista de Infraestrutura
    time: ago 2023 — Presente
    company: Tecnocomp Tecnologia e Serviços
    details: |
      Responsável pela implementação e sustentação de infraestrutura em nuvem e on-premise,
      com foco em automação e observabilidade.

      - Provisão de ambientes cloud com **Terraform** (IaC) e gerenciamento de containers via **Docker**
      - Administração de ambientes virtualizados em **VMware vCenter** e **Proxmox**
      - Desenvolvimento e expansão da infraestrutura de monitoramento com **Zabbix** e **Grafana**
      - Gestão de servidores **Linux** e **Windows Server** em produção

  - role: Coordenador de NOC
    time: mai 2022 — set 2023
    company: Tecnocomp Tecnologia e Serviços
    details: |
      Liderança da equipe de Network Operations Center, garantindo SLAs e disponibilidade
      dos serviços dos clientes.

      - Coordenação de equipe técnica com foco em resposta a incidentes e melhoria de processos
      - Gerenciamento e otimização das ferramentas de monitoramento (**Zabbix**, **SolarWinds**, **PRTG**)
      - Criação de dashboards analíticos no **Grafana** e **PRTG** para visualização operacional
      - Gestão de chamados e escaladas via **Qualitor**

  - role: Analista de NOC
    time: jul 2021 — mai 2022
    company: Tecnocomp Tecnologia e Serviços
    details: |
      Monitoramento proativo de links, switches, access points, aplicações e servidores
      de clientes empresariais.

      - Operação e análise de alertas em **Zabbix**, **SolarWinds** e **PRTG**
      - Criação e manutenção de dashboards de visibilidade operacional no **Grafana**
      - Atendimento e escalada de incidentes de infraestrutura

  - role: Analista de Suporte Técnico N1/N2
    time: set 2018 — set 2020
    company: Tecnocomp Tecnologia e Serviços
    details: |
      Suporte técnico presencial no Hospital Moriah, ambiente crítico 24/7.

      - Administração de desktops e servidores virtualizados em **VMware vCenter**
      - Suporte aos sistemas **Contimatic Contábil** e ERP médico **Philips Tasy**
      - Gestão de chamados N1 e N2 via plataforma **Qualitor**

